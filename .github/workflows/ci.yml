name: CI

# Test-gating only. Builds, runs the green stella-core release lib suite, and
# lints. NO deploy, NO publish — the outward-facing Pages deploy is a separate
# workflow this one neither touches nor references.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # -D warnings bites on every *real* lint class (unused imports, unreachable
  # arms, unused variables, clippy). dead_code is ALLOWED on purpose: this is a
  # research codebase that deliberately keeps reference/oracle/scaffolding impls
  # (the honest-marking discipline polices rot, not the compiler). Harvest-
  # introduced refactor-orphans are still deleted at source, not allowed to rot.
  RUSTFLAGS: -D warnings -A dead_code

jobs:
  test:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test (stella-core release lib suite)
        run: cargo test -p stella-core --lib --release

      # Clippy is scoped to the engine crate's library + its tests — the
      # correctness surface that ships. `cargo build --workspace` above already
      # proves every example / fuzz harness / the stella-viz crate COMPILES
      # (under -D warnings -A dead_code); holding those exploratory targets to
      # the full clippy style bar is cosmetic churn with no correctness value
      # (same research-codebase rationale as -A dead_code, see crate root).
      - name: cargo clippy (engine spine + tests)
        run: cargo clippy -p stella-core --lib --tests
