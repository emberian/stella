<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stella-viz — Stellar Resolution Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Mono', monospace;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 10px 18px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 1.1rem; color: #58a6ff; }
  header span { font-size: 0.8rem; color: #8b949e; }
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: #161b22;
    border-right: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 0.75rem;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 12px 14px 6px;
    border-bottom: 1px solid #21262d;
  }
  .preset-btn {
    display: block;
    width: 100%;
    padding: 10px 14px;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid #21262d;
    color: #c9d1d9;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.82rem;
    transition: background 0.15s;
  }
  .preset-btn:hover { background: #21262d; }
  .preset-btn.active { background: #1f3352; color: #58a6ff; }
  .preset-btn .preset-name { font-weight: 600; }
  .preset-btn .preset-desc {
    margin-top: 4px;
    font-size: 0.72rem;
    color: #8b949e;
    white-space: pre-wrap;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .toolbar {
    padding: 8px 14px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .toolbar button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 5px 14px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .toolbar button:hover { background: #30363d; }
  .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toolbar .step-info {
    font-size: 0.78rem;
    color: #8b949e;
  }
  .panels {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid #30363d;
  }
  .panel:last-child { border-right: none; }
  .panel-header {
    padding: 6px 14px;
    font-size: 0.72rem;
    color: #8b949e;
    background: #161b22;
    border-bottom: 1px solid #21262d;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }
  .panel-body {
    flex: 1;
    overflow: auto;
    padding: 8px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .panel-body.text {
    padding: 14px;
    align-items: flex-start;
    justify-content: flex-start;
  }
  #dot-raw {
    font-size: 0.72rem;
    color: #8b949e;
    white-space: pre;
    overflow: auto;
  }
  #exec-summary {
    font-size: 0.82rem;
    color: #c9d1d9;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  #graph-svg-container {
    min-width: 200px;
    min-height: 200px;
  }
  #graph-svg-container svg {
    max-width: 100%;
  }
  .loading { color: #58a6ff; font-size: 0.82rem; }
  .error { color: #f85149; font-size: 0.82rem; }

  /* Step stepper panel */
  .step-panel {
    padding: 14px;
    font-size: 0.78rem;
    color: #c9d1d9;
    line-height: 1.7;
  }
  .step-entry {
    margin-bottom: 10px;
    padding: 8px 10px;
    background: #21262d;
    border-radius: 6px;
    border-left: 3px solid #30363d;
  }
  .step-entry.current {
    border-left-color: #58a6ff;
    background: #1f3352;
  }
  .step-label {
    font-weight: 600;
    color: #58a6ff;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .step-stars {
    font-size: 0.78rem;
    color: #e6edf3;
  }
</style>
</head>
<body>

<header>
  <h1>stella-viz</h1>
  <span>Stellar Resolution Explorer — proto theorem-prover UI</span>
</header>

<div class="main">
  <div class="sidebar" id="sidebar">
    <h2>Presets</h2>
    <div id="preset-list"><span class="loading" style="padding:14px;display:block;">Loading presets…</span></div>
  </div>

  <div class="content">
    <div class="toolbar">
      <button id="btn-prev" disabled title="Previous step">← Prev</button>
      <button id="btn-next" disabled title="Next step">Next →</button>
      <span class="step-info" id="step-info">Select a preset to begin.</span>
    </div>

    <div class="panels">
      <!-- Left panel: rendered dep-graph -->
      <div class="panel" style="flex:2;">
        <div class="panel-header">Dependency graph D[Φ; C]</div>
        <div class="panel-body" id="graph-panel-body">
          <div id="graph-svg-container"><span class="loading">Select a preset to visualize.</span></div>
        </div>
      </div>

      <!-- Right panel: execution trace / step -->
      <div class="panel" style="flex:1; min-width:220px;">
        <div class="panel-header">Execution result / step trace</div>
        <div class="panel-body text" id="exec-panel">
          <span class="loading">Select a preset to see execution result.</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- viz.js via CDN (renders Graphviz DOT to SVG in-browser) -->
<script src="https://cdn.jsdelivr.net/npm/@viz-js/viz@3/lib/viz-standalone.js"></script>
<script>
"use strict";

// ── State ─────────────────────────────────────────────────────────────────────
let gViz = null;           // Viz.js instance (loaded async)
let gPresets = [];         // [{id, name, description}]
let gCurrentPreset = null; // current preset data from /api/dot/<n>
let gStepIndex = 0;        // current step index in the step trace

// ── Viz.js init ────────────────────────────────────────────────────────────────
// @viz-js/viz exposes Viz as a global after loading.
async function initViz() {
  try {
    if (typeof Viz !== "undefined") {
      gViz = await Viz.instance();
    }
  } catch (e) {
    console.warn("viz.js failed to load (CDN offline?). DOT will show as text.", e);
  }
}

// ── Fetch helpers ──────────────────────────────────────────────────────────────
async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  return r.json();
}

// ── Preset list ────────────────────────────────────────────────────────────────
async function loadPresets() {
  try {
    gPresets = await fetchJson("/api/presets");
    renderPresetList();
  } catch (e) {
    document.getElementById("preset-list").innerHTML =
      `<span class="error">Failed to load presets: ${e.message}</span>`;
  }
}

function renderPresetList() {
  const el = document.getElementById("preset-list");
  el.innerHTML = "";
  gPresets.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "preset-btn";
    btn.innerHTML = `<div class="preset-name">${esc(p.name)}</div><div class="preset-desc">${esc(p.description)}</div>`;
    btn.addEventListener("click", () => selectPreset(i));
    el.appendChild(btn);
  });
}

// ── Select & load a preset ─────────────────────────────────────────────────────
async function selectPreset(idx) {
  // Highlight active button
  document.querySelectorAll(".preset-btn").forEach((b, i) => {
    b.classList.toggle("active", i === idx);
  });

  document.getElementById("graph-svg-container").innerHTML =
    `<span class="loading">Rendering…</span>`;
  document.getElementById("exec-panel").innerHTML =
    `<span class="loading">Loading…</span>`;
  document.getElementById("step-info").textContent = "Loading…";

  try {
    gCurrentPreset = await fetchJson(`/api/dot/${idx}`);
    gStepIndex = 0;
    renderCurrent();
  } catch (e) {
    document.getElementById("graph-svg-container").innerHTML =
      `<span class="error">Error: ${e.message}</span>`;
  }
}

// ── Rendering ──────────────────────────────────────────────────────────────────
async function renderCurrent() {
  if (!gCurrentPreset) return;

  // Render DOT → SVG
  const dotSrc = gCurrentPreset.dep_graph_dot;
  const container = document.getElementById("graph-svg-container");
  if (gViz) {
    try {
      const svg = await gViz.renderSVGElement(dotSrc);
      svg.setAttribute("width", "100%");
      container.innerHTML = "";
      container.appendChild(svg);
    } catch (e) {
      // Fallback: show DOT text if rendering fails
      container.innerHTML = `<pre id="dot-raw">${esc(dotSrc)}</pre>`;
    }
  } else {
    // No viz.js: show raw DOT with a message
    container.innerHTML = `
      <div>
        <p class="error" style="margin-bottom:8px;">viz.js not available (CDN offline). Raw DOT source:</p>
        <pre id="dot-raw">${esc(dotSrc)}</pre>
      </div>`;
  }

  // Render execution summary
  renderExecPanel();

  // Update step controls
  updateStepControls();
}

// Parse the execution summary into "steps" for the stepper
function parseSteps(summary) {
  // Treat the summary as a single-item trace for now (server provides full IEx result).
  // The step concept: "step 0" = initial constellation description; "step 1" = IEx result.
  return [
    { label: "Step 0: Initial constellation", stars: "Dependency graph D[Φ;C] shown on the left." },
    { label: "Step 1: Execution result (↨♭ IEx / AEx)", stars: summary },
  ];
}

function renderExecPanel() {
  const panel = document.getElementById("exec-panel");
  const steps = parseSteps(gCurrentPreset.execution_summary);
  let html = `<div class="step-panel">`;
  steps.forEach((s, i) => {
    const cls = i === gStepIndex ? "step-entry current" : "step-entry";
    html += `<div class="${cls}">
      <div class="step-label">${esc(s.label)}</div>
      <div class="step-stars">${esc(s.stars)}</div>
    </div>`;
  });
  html += `</div>`;
  panel.innerHTML = html;

  // Scroll current step into view
  const current = panel.querySelector(".step-entry.current");
  if (current) current.scrollIntoView({ block: "nearest" });
}

function updateStepControls() {
  if (!gCurrentPreset) {
    document.getElementById("btn-prev").disabled = true;
    document.getElementById("btn-next").disabled = true;
    document.getElementById("step-info").textContent = "Select a preset.";
    return;
  }
  const steps = parseSteps(gCurrentPreset.execution_summary);
  document.getElementById("btn-prev").disabled = gStepIndex <= 0;
  document.getElementById("btn-next").disabled = gStepIndex >= steps.length - 1;
  document.getElementById("step-info").textContent =
    `Preset: ${gCurrentPreset.name} — Step ${gStepIndex + 1} / ${steps.length}`;
}

// ── Step buttons ───────────────────────────────────────────────────────────────
document.getElementById("btn-prev").addEventListener("click", () => {
  if (gStepIndex > 0) { gStepIndex--; renderExecPanel(); updateStepControls(); }
});
document.getElementById("btn-next").addEventListener("click", () => {
  const steps = gCurrentPreset ? parseSteps(gCurrentPreset.execution_summary) : [];
  if (gStepIndex < steps.length - 1) { gStepIndex++; renderExecPanel(); updateStepControls(); }
});

// ── HTML escaping ──────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── Boot ───────────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([initViz(), loadPresets()]);
})();
</script>
</body>
</html>
