[package]
name = "stella-core"
version = "0.1.0"
edition = "2021"

[dependencies]
open-hypergraphs = "=0.3.1"
open-hypergraphs-dot = "=0.2.4"
lasso = { version = "=0.7.3", features = ["multi-threaded"] }
rustc-hash = "=1.1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false
